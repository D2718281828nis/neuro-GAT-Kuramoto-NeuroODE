training: {epochs: 100, folds: 5, grouped_subject_split: true, early_stopping_patience: 12, gradient_clip: 1.0, mixed_precision: true, checkpoint_dir: outputs/checkpoints}
outputs: {predictions: true, metrics: true, plots_png: true, plots_svg: true}
