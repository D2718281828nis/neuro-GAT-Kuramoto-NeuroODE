<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchical multi-band Kuramoto-attention Neural ODE</title>
  <desc id="desc">EEG features flow through an encoder and continuous dynamics into graph, node, and link tasks. Five colored rhythm nodes per representative region are pooled hierarchically.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <style>
      .panel{stroke:#1e293b;stroke-width:3;rx:8}.flow{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#arrow)}
      .label{font:600 16px sans-serif;fill:#172033;text-anchor:middle}.small{font:14px sans-serif;fill:#334155;text-anchor:middle}
      .edge{stroke:#94a3b8;stroke-width:2}.pool{stroke:#7c3aed;stroke-width:3}.node{stroke:#1e293b;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <g>
    <rect class="panel" x="25" y="55" width="145" height="105" fill="#dbeafe"/><text class="label" x="97" y="98">Raw EEG</text><text class="small" x="97" y="125">[B, C, T]</text>
    <rect class="panel" x="205" y="55" width="145" height="105" fill="#e0e7ff"/><text class="label" x="277" y="95">Rhythm</text><text class="label" x="277" y="118">features</text><text class="small" x="277" y="142">[B, R, 5, 6]</text>
    <rect class="panel" x="385" y="55" width="145" height="105" fill="#ede9fe"/><text class="label" x="457" y="99">Biomedical</text><text class="label" x="457" y="123">encoder</text>
    <rect class="panel" x="565" y="55" width="155" height="105" fill="#f3e8ff"/><text class="label" x="642" y="91">Kuramoto +</text><text class="label" x="642" y="115">attention + GRAND</text><text class="small" x="642" y="140">Neural ODE</text>
    <rect class="panel" x="755" y="55" width="140" height="105" fill="#ccfbf1"/><text class="label" x="825" y="98">Hierarchical</text><text class="label" x="825" y="122">pooling</text>
    <rect class="panel" x="955" y="20" width="220" height="70" fill="#dcfce7"/><text class="label" x="1065" y="61">Graph classification</text>
    <rect class="panel" x="955" y="105" width="220" height="70" fill="#fef3c7"/><text class="label" x="1065" y="146">Node prediction</text>
    <rect class="panel" x="955" y="190" width="220" height="70" fill="#fee2e2"/><text class="label" x="1065" y="231">Link prediction</text>
    <path class="flow" d="M170 108H205M350 108H385M530 108H565M720 108H755M895 108C925 108 925 55 955 55M895 108H955M895 108C925 108 925 225 955 225"/>
  </g>
  <text class="label" x="600" y="302">Hierarchical electrode / rhythm graph</text>
  <g id="graph">
    <g stroke="#60a5fa" stroke-width="2"><path d="M150 410H370H590H810H1030"/></g><g stroke="#2dd4bf" stroke-width="2"><path d="M150 455H370H590H810H1030"/></g><g stroke="#facc15" stroke-width="2"><path d="M150 500H370H590H810H1030"/></g><g stroke="#fb923c" stroke-width="2"><path d="M150 545H370H590H810H1030"/></g><g stroke="#f43f5e" stroke-width="2"><path d="M150 590H370H590H810H1030"/></g>
    <g class="edge"><path d="M150 410V590M370 410V590M590 410V590M810 410V590M1030 410V590"/></g>
    <g class="pool" fill="none"><path d="M150 375L590 340M370 375L590 340M590 375V340M810 375L590 340M1030 375L590 340"/></g>
    <circle class="node" cx="590" cy="340" r="22" fill="#7e22ce"/><text class="small" x="590" y="346" fill="white">graph</text>
    <g fill="#a78bfa"> <circle class="node" cx="150" cy="375" r="17"/><circle class="node" cx="370" cy="375" r="17"/><circle class="node" cx="590" cy="375" r="17"/><circle class="node" cx="810" cy="375" r="17"/><circle class="node" cx="1030" cy="375" r="17"/></g>
    <g fill="#60a5fa"><circle class="node" cx="150" cy="410" r="13"/><circle class="node" cx="370" cy="410" r="13"/><circle class="node" cx="590" cy="410" r="13"/><circle class="node" cx="810" cy="410" r="13"/><circle class="node" cx="1030" cy="410" r="13"/></g>
    <g fill="#2dd4bf"><circle class="node" cx="150" cy="455" r="13"/><circle class="node" cx="370" cy="455" r="13"/><circle class="node" cx="590" cy="455" r="13"/><circle class="node" cx="810" cy="455" r="13"/><circle class="node" cx="1030" cy="455" r="13"/></g>
    <g fill="#facc15"><circle class="node" cx="150" cy="500" r="13"/><circle class="node" cx="370" cy="500" r="13"/><circle class="node" cx="590" cy="500" r="13"/><circle class="node" cx="810" cy="500" r="13"/><circle class="node" cx="1030" cy="500" r="13"/></g>
    <g fill="#fb923c"><circle class="node" cx="150" cy="545" r="13"/><circle class="node" cx="370" cy="545" r="13"/><circle class="node" cx="590" cy="545" r="13"/><circle class="node" cx="810" cy="545" r="13"/><circle class="node" cx="1030" cy="545" r="13"/></g>
    <g fill="#f43f5e"><circle class="node" cx="150" cy="590" r="13"/><circle class="node" cx="370" cy="590" r="13"/><circle class="node" cx="590" cy="590" r="13"/><circle class="node" cx="810" cy="590" r="13"/><circle class="node" cx="1030" cy="590" r="13"/></g>
  </g>
  <g class="small"><circle cx="210" cy="645" r="10" fill="#60a5fa"/><text x="255" y="650">delta</text><circle cx="340" cy="645" r="10" fill="#2dd4bf"/><text x="385" y="650">theta</text><circle cx="470" cy="645" r="10" fill="#facc15"/><text x="515" y="650">alpha</text><circle cx="600" cy="645" r="10" fill="#fb923c"/><text x="640" y="650">beta</text><circle cx="720" cy="645" r="10" fill="#f43f5e"/><text x="770" y="650">gamma</text><circle cx="870" cy="645" r="10" fill="#a78bfa"/><text x="935" y="650">region pool</text></g>
</svg>
