<text x="502" y="93" class="title">Link prediction — ROC-AUC 0.969</text><text x="502" y="117" class="small">columns: predicted 0 / 1</text><rect x="400" y="135" width="100" height="80" fill="#2563eb" fill-opacity="0.843" stroke="#1e293b"/><text x="450" y="183" class="value">6</text><rect x="505" y="135" width="100" height="80" fill="#2563eb" fill-opacity="0.414" stroke="#1e293b"/><text x="555" y="183" class="value">2</text><rect x="400" y="220" width="100" height="80" fill="#2563eb" fill-opacity="0.307" stroke="#1e293b"/><text x="450" y="268" class="value">1</text><rect x="505" y="220" width="100" height="80" fill="#2563eb" fill-opacity="0.950" stroke="#1e293b"/><text x="555" y="268" class="value">7</text><text x="385" y="217" class="small" transform="rotate(-90 385 217)">rows: true 0 / 1</text>
